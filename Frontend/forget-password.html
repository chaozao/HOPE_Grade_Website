<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password — Hope Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/signin.css">
</head>
<body>
  <div class="auth">
    <aside class="auth-brand">
      <div class="auth-brand-inner">
        <img src="hope.png" alt="Hope" class="auth-logo">
        <p class="auth-tagline">Everything your team is working on, in one place.</p>
      </div>
    </aside>

    <main class="auth-form-panel">
      <div class="auth-form-wrap">
        <h1>Forgot password</h1>
        <p class="auth-subtitle" id="form-subtitle">Enter the email on your account and we'll send you a reset link.</p>

        <div class="auth-banner" id="form-banner" hidden></div>

        <form id="forgot-form" novalidate>
          <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="name@company.com" required>
          </div>

          <button type="submit" class="btn-primary" id="submit-btn">Send reset link</button>
        </form>

        <p class="auth-switch">Remembered your password? <a href="index.html">Back to sign in</a></p>
      </div>
    </main>
  </div>

  <script src="js/forget-password.js"></script>
</body>
</html>
