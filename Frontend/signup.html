<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — Hope Workspace</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/signup.css">
</head>
<body>
  <div class="auth">
    <aside class="auth-brand">
      <div class="auth-brand-inner">
        <img src="hope.png" alt="Hope" class="auth-logo">
        <p class="auth-tagline" id="auth-tagline"><span id="typing-text"></span><span class="typing-cursor">|</span></p>
      </div>
    </aside>

    <main class="auth-form-panel">
      <div class="auth-form-wrap">
        <h1>Create your account</h1>
        <p class="auth-subtitle">Set up your workspace in less than a minute.</p>

        <div class="auth-banner" id="form-banner" hidden></div>

        <form id="signup-form" novalidate>
          <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username">
            <span class="field-error" id="username-error"></span>
          </div>

          <div class="field">
            <label for="email">Email address</label>
            <input type="text" id="email" name="email" placeholder="name@gmail.com" inputmode="email">
            <span class="field-error" id="email-error"></span>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password-field">
            <input type="password" id="password" name="password" placeholder="Enter your password">
            <button type="button" class="toggle-password" id="toggle-password" aria-label="Show password">
            <i class="bi bi-eye-slash-fill"></i></button>
            </div>
            <span class="field-error" id="password-error"></span>
          </div>

          <button type="submit" class="btn-primary" id="submit-btn">Create account</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="index.html">Sign in</a></p>
      </div>
    </main>
  </div>

  <script src="js/signup.js"></script>
</body>
</html>
