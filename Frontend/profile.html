<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — Hope Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>
  <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Open menu">
    <i class="bi bi-chevron-right"></i>
  </button>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <div class="dashboard">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="hope.png" alt="Hope" class="sidebar-logo">
        <span class="sidebar-brand-name">Hope</span>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
          <i class="bi bi-speedometer2"></i>
          <span>Grade Overview</span>
        </a>
        <a href="grade-entry.html" class="nav-item">
          <i class="bi bi-pencil-square"></i>
          <span>Grade Entry</span>
        </a>
        <a href="student-insights.html" class="nav-item">
          <i class="bi bi-graph-up"></i>
          <span>Student Insights</span>
        </a>
        <a href="profile.html" class="nav-item active">
          <i class="bi bi-person-circle"></i>
          <span>My Profile</span>
        </a>
      </nav>

      <div class="sidebar-user">
        <div class="user-avatar"><i class="bi bi-person-fill"></i></div>
        <div class="user-info">
          <span class="user-name" id="user-name">Teacher</span>
          <span class="user-role">Subject Teacher</span>
        </div>
        <button class="logout-btn" id="logout-btn" aria-label="Log out">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </aside>

    <main class="main-content">
      <header class="content-header">
        <div>
          <h1>My Profile</h1>
          <p class="content-subtitle">Update your name, photo, and password.</p>
        </div>
      </header>

      <div class="settings-banner" id="form-banner" hidden></div>

      <section class="settings-card">
        <h2>Profile photo</h2>
        <div class="avatar-upload">
          <div class="avatar-preview" id="avatar-preview">
            <i class="bi bi-person-fill"></i>
          </div>
          <div class="avatar-upload-actions">
            <label class="btn-secondary" for="photo-input">Choose photo</label>
            <input type="file" id="photo-input" accept="image/*">
            <p class="field-hint">JPG or PNG, up to 2MB.</p>
          </div>
        </div>
      </section>

      <section class="settings-card">
        <h2>Name</h2>
        <form id="name-form">
          <div class="field">
            <label for="username">Display name</label>
            <input type="text" id="username" required>
          </div>
          <button type="submit" class="btn-primary">Save name</button>
        </form>
      </section>

      <section class="settings-card">
        <h2>Password</h2>
        <form id="password-form">
          <div class="field">
            <label for="current-password">Current password</label>
            <input type="password" id="current-password" required>
          </div>
          <div class="field">
            <label for="new-password">New password</label>
            <input type="password" id="new-password" required minlength="8">
          </div>
          <div class="field">
            <label for="confirm-new-password">Confirm new password</label>
            <input type="password" id="confirm-new-password" required minlength="8">
          </div>
          <button type="submit" class="btn-primary">Change password</button>
        </form>
      </section>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sidebar-toggle.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
