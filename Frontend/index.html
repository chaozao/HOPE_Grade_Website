<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Hope Workspace</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/signin.css">
</head>
<body>
  <div class="auth">
    <aside class="auth-brand">
      <div class="auth-brand-inner">
        <img src="hope.png" alt="Hope" class="auth-logo">
        <p class="auth-tagline" id="auth-tagline"><span id="typing-text"></span><span class="typing-cursor">|</span></p>
      </div>
    </aside>

    <main class="auth-form-panel">
      <div class="auth-form-wrap">
        <h1>Sign in</h1>
        <p class="auth-subtitle">Enter your details to sign in to your workspace.</p>

        <div class="auth-banner" id="form-banner" hidden></div>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="name@company.com" required>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password-field">
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
            <button type="button" class="toggle-password" id="toggle-password" aria-label="Show password">
            <i class="bi bi-eye-slash-fill"></i></button>
            </button>
            </div>
          </div>    

          <div class="field-row">
            <label class="checkbox">
              <input type="checkbox" id="remember-me" name="remember-me">
              <span>Remember me</span>
            </label>
            <a href="forget-password.html" class="link-muted">Forgot password?</a>
          </div>

          <button type="submit" class="btn-primary" id="submit-btn">Sign in</button>
        </form>

        <p class="auth-switch">Don't have an account? <a href="signup.html">Create one</a></p>
      </div>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/signin.js"></script>
</body>
</html>
