<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — Hope Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/signin.css">
</head>
<body>
  <div class="auth">
    <aside class="auth-brand">
      <div class="auth-brand-inner">
        <img src="hope.png" alt="Hope" class="auth-logo">
        <p class="auth-tagline">Everything your team is working on, in one place.</p>
      </div>
    </aside>

    <main class="auth-form-panel">
      <div class="auth-form-wrap">
        <h1>Set a new password</h1>
        <p class="auth-subtitle">Choose a new password for your account.</p>

        <div class="auth-banner" id="form-banner" hidden></div>

        <form id="reset-form" novalidate>
          <div class="field">
            <label for="password">New password</label>
            <input type="password" id="password" name="password" placeholder="Enter a new password" required minlength="8">
          </div>

          <div class="field">
            <label for="confirm-password">Confirm new password</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter the new password" required minlength="8">
          </div>

          <button type="submit" class="btn-primary" id="submit-btn">Reset password</button>
        </form>

        <p class="auth-switch"><a href="index.html">Back to sign in</a></p>
      </div>
    </main>
  </div>

  <script src="js/reset-password.js"></script>
</body>
</html>
